<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alyssa & Connor · The King Wedding</title>
  <meta name="description" content="Alyssa and Connor are getting married in 2027. Enter your name to continue.">
  <meta property="og:title" content="Alyssa & Connor · The King Wedding">
  <meta property="og:description" content="Some stories are meant for the right people.">
  <meta property="og:image" content="/public/landing.png">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Italiana&family=Bodoni+Moda:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/shared.css?v=save2">
  <link rel="stylesheet" href="/css/home.css?v=mobile29">
  <link rel="preload" as="image" href="/public/landing.png" media="(min-width: 800px)" fetchpriority="high">
  <link rel="preload" as="image" href="/public/landing-mobile.jpg" media="(max-width: 799px)" fetchpriority="high">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("king.resetHome")) {
          sessionStorage.removeItem("king.resetHome");
          sessionStorage.removeItem("king.invite");
          sessionStorage.removeItem("king.detailsConfirmed");
        }
        var q = new URLSearchParams(location.search);
        if (q.get("code") || q.get("gate") || sessionStorage.getItem("king.invite")) {
          document.documentElement.classList.add("invite-returning");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="landing-body">
  <div class="landing-photo" aria-hidden="true">
    <div class="landing-scene">
      <div class="invite-slides" data-invite-slides hidden></div>
      <div class="landing-overlay"></div>
      <span class="candle-flame" style="left: 89.77%; top: 5.3%"></span>
      <span class="candle-flame" style="left: 92.72%; top: 7.2%"></span>
      <span class="candle-flame" style="left: 94.88%; top: 15.95%"></span>
      <span class="candle-flame" style="left: 97.72%; top: 15.15%"></span>
    </div>
  </div>

  <canvas class="key3d-canvas" data-key3d hidden></canvas>
  <div class="intro-video" data-intro-video hidden>
    <div class="intro-video-scene">
      <video data-intro-src="/public/introVideo.mp4" playsinline webkit-playsinline preload="auto" muted></video>
      <img class="intro-video-frame" data-src="/public/background-with-frame.png" data-src-mobile="/public/background-with-frame-mobile.png" alt="">
    </div>
  </div>
  <main class="invitation-gate" data-gate-stage>
    <div class="monogram" aria-hidden="true">
      <span>A</span>
      <span class="monogram-rule" data-key-slot>
        <img class="monogram-key-png" src="/public/key.png" alt="" hidden>
      </span>
      <span>C</span>
    </div>

    <p class="household-kicker" data-household-greeting hidden></p>
    <h1 class="names">
      <span class="names-sealed">
        <span>Alyssa</span>
        <span class="and">&amp;</span>
        <span>Connor</span>
      </span>
      <span class="names-invited">You're Invited</span>
    </h1>
    <div class="invite-mark" aria-hidden="true"></div>

    <p class="date">Wedding Festivities</p>

    <div data-sealed>
      <div class="lock-wrapper">
        <button class="lock-hotspot" type="submit" form="invite" aria-label="Enter your name">
          <img class="lock" src="/public/lock.png" alt="">
        </button>
        <div class="lock-glow" aria-hidden="true"></div>
      </div>

      <form class="name-form" id="invite" data-code-form novalidate>
        <div class="name-input-wrap">
          <div class="name-fields">
            <label class="visually-hidden" for="firstName">First name</label>
            <input class="name-input" id="firstName" name="firstName" required autocomplete="given-name" spellcheck="false" placeholder="first name">
            <label class="visually-hidden" for="lastName">Last name</label>
            <input class="name-input" id="lastName" name="lastName" required autocomplete="family-name" spellcheck="false" placeholder="last name">
          </div>
          <button class="find-invite" type="submit">Find my Invite</button>
          <p class="form-error" data-code-error></p>
        </div>
      </form>
    </div>

    <div class="chooser-links" data-chooser hidden>
      <div data-chooser-doors></div>
    </div>

    <div data-continue hidden>
      <a class="enter-link" data-continue-link href="#">Continue</a>
    </div>

    <section class="household-desk" data-household hidden>
      <p class="household-count" data-household-count></p>
      <div class="event-doors" data-event-doors></div>
      <div class="household-mail">
        <p>Formal invitations via mail to follow.</p>
        <button class="find-invite" type="button" data-open-details>Edit your contact details</button>
      </div>
      <button class="household-reset" type="button" data-not-you>Not you?</button>
    </section>

    <div class="fleur-rule" aria-hidden="true">
      <span></span>
      <b>⚜</b>
      <span></span>
    </div>

    <p class="secret-caps">Our favorite people,</p>
    <p class="secret-italic">our happiest chapter.</p>

    <div class="fleur-rule fleur-rule--faint" aria-hidden="true">
      <span></span>
      <b>⚜</b>
      <span></span>
    </div>
  </main>

  <div class="details-modal" data-details-modal hidden>
    <button class="details-modal-backdrop" type="button" data-close-details aria-label="Close details"></button>
    <div class="details-modal-panel" role="dialog" aria-modal="true" aria-labelledby="details-title">
      <div class="details-envelope" aria-hidden="true">
        <img class="details-envelope-art" src="/public/contact-details.png" alt="">
      </div>
      <article class="details-letter">
        <div class="details-letter-paper" aria-hidden="true"></div>
        <span class="details-letter-rule" aria-hidden="true"></span>
        <img class="details-letter-seal" src="/public/envelopes/olive-seal.png" alt="" aria-hidden="true">
        <span class="details-flourish details-flourish--tl" aria-hidden="true"></span>
        <span class="details-flourish details-flourish--tr" aria-hidden="true"></span>
        <span class="details-flourish details-flourish--bl" aria-hidden="true"></span>
        <span class="details-flourish details-flourish--br" aria-hidden="true"></span>
        <button class="details-modal-close" type="button" data-close-details aria-label="Close">&times;</button>
        <div class="details-sheet">
      <div data-details-form-wrap>
        <h2 id="details-title">Contact Information</h2>
        <p class="details-lede">Please provide a mobile number, email, and mailing address for each guest.</p>
        <form class="household-form address-form" data-household-form novalidate>
          <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off">
          <label class="visually-hidden">First name <input name="firstName"></label>
          <label class="visually-hidden">Last name <input name="lastName"></label>
          <label class="visually-hidden">Phone <input name="phone" type="tel"></label>
          <label class="visually-hidden">Email <input name="email" type="email"></label>
          <div class="letter-folds" data-letter-folds>
          <div class="party-list" data-party-list></div>
          <div class="form-actions" data-letter-panel>
            <button class="find-invite" type="submit">Save contact details</button>
            <button class="details-not-you" type="button" data-not-you>Not you?</button>
          </div>
          </div>
          <p class="form-error" data-form-error></p>
        </form>
      </div>
      <div class="details-success" data-details-success hidden>
        <p>Success, your details have been updated.</p>
      </div>
        </div>
      </article>
    </div>
  </div>

  <nav class="invite-slide-nav" data-invite-nav hidden>
    <button class="invite-slide-arrow is-prev" type="button" data-invite-prev aria-label="Previous photo">
      <svg viewBox="0 0 24 48" aria-hidden="true">
        <path d="M18 4 6 24l12 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button class="invite-slide-arrow is-next" type="button" data-invite-next aria-label="Next photo">
      <svg viewBox="0 0 24 48" aria-hidden="true">
        <path d="M6 4l12 20L6 44" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </nav>
  <audio data-song preload="none" data-src="/public/enchanted.mp3" data-src-mobile="/public/enchanted-mobile.mp3"></audio>
  <button class="song-toggle" type="button" data-song-toggle hidden aria-pressed="false" aria-label="Mute music">
    <svg class="song-icon song-icon--on" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
    </svg>
    <svg class="song-icon song-icon--off" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>
  <script type="module" src="/js/home.js?v=mobile20"></script>
</body>
</html>
